# .goreleaser.yaml
#
# Creates the GitHub release with changelog.
# Native platform builds are handled by release.yaml which attaches
# binaries to the release created here.

version: 2
project_name: kg

before:
  hooks:
    - go mod tidy

builds:
  - skip: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"