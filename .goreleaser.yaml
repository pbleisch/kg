# .goreleaser.yaml
#
# kg is pure Go: one cross-compiled build covers every platform, with no
# native library to bundle and no rpath to embed (ADR-0027).

version: 2
project_name: kg

before:
  hooks:
    - go mod tidy

builds:
  - id: kg
    main: ./cmd/kg
    binary: kg
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: kg
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
