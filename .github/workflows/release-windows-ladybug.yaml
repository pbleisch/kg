name: Release Windows Ladybug build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-ladybug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install MSYS2 + mingw toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: |
            mingw-w64-x86_64-toolchain

      - name: Install Ladybug native libs (Windows)
        shell: bash
        run: |
          set -e
          echo "Fetching Ladybug native libraries (using bash)..."
          curl -sL https://raw.githubusercontent.com/LadybugDB/go-ladybug/refs/heads/master/download_lbug.sh -o download_lbug.sh
          chmod +x download_lbug.sh
          ./download_lbug.sh -out lib-ladybug -platform windows || true
          ls -la lib-ladybug || true

      - name: Set CGO env (Windows)
        shell: bash
        run: |
          # Use Unix-style paths for the build step under bash on Windows runners
          echo "CGO_LDFLAGS=-L$(pwd)/lib-ladybug" >> $GITHUB_ENV
          echo "CGO_CFLAGS=-I$(pwd)/lib-ladybug/include" >> $GITHUB_ENV
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          echo "PATH=$(pwd)/lib-ladybug:$PATH" >> $GITHUB_ENV

      - name: Build Windows kg-ladybug
        shell: bash
        run: |
          set -e
          # Ensure mingw GCC is used
          export CC=x86_64-w64-mingw32-gcc || true
          echo "Using CC=$CC"
          ${CC:-x86_64-w64-mingw32-gcc} go build -tags=ladybug -o bin/kg-ladybug-windows-amd64.exe ./cmd/kg

      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: kg-ladybug-windows-amd64
          path: bin/kg-ladybug-windows-amd64.exe
