name: Release Windows Ladybug build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-ladybug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Ladybug native libs (Windows)
        run: |
          # Placeholder: install or fetch Windows-compatible Ladybug libs
          powershell -Command "iwr -useb https://raw.githubusercontent.com/LadybugDB/go-ladybug/refs/heads/master/download_lbug.ps1 | iex" || true

      - name: Set CGO env (Windows)
        run: |
          echo "CGO_LDFLAGS=-L$(pwd)/lib-ladybug -Wl,-rpath,$(pwd)/lib-ladybug" >> $GITHUB_ENV
          echo "CGO_ENABLED=1" >> $GITHUB_ENV

      - name: Build Windows kg-ladybug
        shell: powershell
        run: |
          go build -tags=ladybug -o bin/kg-ladybug-windows-amd64.exe ./cmd/kg

      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: kg-ladybug-windows-amd64
          path: bin/kg-ladybug-windows-amd64.exe
