name: Release Windows Ladybug build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-ladybug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Ladybug native libs (Windows)
        shell: powershell
        run: |
          Write-Host "Fetching Ladybug native libraries..."
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/LadybugDB/go-ladybug/refs/heads/master/download_lbug.ps1' -OutFile download_lbug.ps1 -UseBasicParsing
          if (Test-Path ./download_lbug.ps1) { .\download_lbug.ps1 -OutDir lib-ladybug -Platform windows } else { Write-Host "download_lbug.ps1 not found, continuing..." }
          Get-ChildItem -Recurse lib-ladybug | Write-Host

      - name: Set CGO env (Windows)
        shell: powershell
        run: |
          # Set linker and include paths for Windows builds
          Add-Content -Path $env:GITHUB_ENV -Value "CGO_LDFLAGS=-L$(pwd)/lib-ladybug"
          Add-Content -Path $env:GITHUB_ENV -Value "CGO_CFLAGS=-I$(pwd)/lib-ladybug/include"
          Add-Content -Path $env:GITHUB_ENV -Value "CGO_ENABLED=1"
          # Prepend lib folder to PATH so the linker/runtime can find DLLs
          $newPath = "$(pwd)\lib-ladybug;" + $env:PATH
          Add-Content -Path $env:GITHUB_ENV -Value "PATH=$newPath"

      - name: Build Windows kg-ladybug
        shell: powershell
        run: |
          go build -tags=ladybug -o bin/kg-ladybug-windows-amd64.exe ./cmd/kg

      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: kg-ladybug-windows-amd64
          path: bin/kg-ladybug-windows-amd64.exe
