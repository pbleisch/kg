name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
    strategy:
      matrix:
        go-version: ['1.25']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download ladybug libraries
        run: curl -sL https://raw.githubusercontent.com/LadybugDB/go-ladybug/refs/heads/master/download_lbug.sh | bash -s -- -out lib-ladybug

      - name: Vet
        run: go vet ./...
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/lib-ladybug

      - name: Test
        run: go test ./... -count=1
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/lib-ladybug

      - name: Test (race detector)
        run: go test -race ./... -count=1
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/lib-ladybug

      - name: Integration tests
        run: go test -tags=integration ./... -count=1
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/lib-ladybug

      - name: Build
        run: go build -o bin/kg ./cmd/kg/
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/lib-ladybug
