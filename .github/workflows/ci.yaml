name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # kg is pure Go since the LadybugDB index was removed (ADR-0027).
      # Building with CGO off is the check that it stays that way.
      CGO_ENABLED: 0
    strategy:
      matrix:
        go-version: ['1.25']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Format
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needs to run on:"; echo "$out"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Test (race detector)
        run: go test -race ./... -count=1
        env:
          CGO_ENABLED: 1  # the race detector needs cgo; the product does not

      - name: Integration tests
        run: go test -tags=integration ./... -count=1

      - name: Build
        run: go build -o bin/kg ./cmd/kg/
