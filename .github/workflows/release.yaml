name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # =============================================================
  # GoReleaser: non-CGO kg builds + creates the GitHub Release
  # =============================================================
  goreleaser:
    name: Release (GoReleaser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =============================================================
  # CGO Ladybug builds on native runners
  # =============================================================
  ladybug-linux:
    name: Ladybug (Linux amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download Ladybug native libs
        run: |
          curl -sL https://raw.githubusercontent.com/LadybugDB/go-ladybug/refs/heads/master/download_lbug.sh \
            | bash -s -- -out lib-ladybug

      - name: Build
        env:
          CGO_ENABLED: '1'
          CGO_LDFLAGS: -L${{ github.workspace }}/lib-ladybug -Wl,-rpath,$ORIGIN/lib-ladybug
          CGO_CFLAGS: -I${{ github.workspace }}/lib-ladybug/include
        run: |
          mkdir -p bin
          go build -tags=ladybug -o bin/kg-ladybug-linux-amd64 ./cmd/kg

      - uses: actions/upload-artifact@v4
        with:
          name: kg-ladybug-linux-amd64
          path: bin/kg-ladybug-linux-amd64

  ladybug-macos:
    name: Ladybug (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download Ladybug native libs
        run: |
          curl -sL https://raw.githubusercontent.com/LadybugDB/go-ladybug/refs/heads/master/download_lbug.sh \
            -o download_lbug.sh
          chmod +x download_lbug.sh
          ./download_lbug.sh -out lib-ladybug -platform darwin

      - name: Build arm64 (native)
        env:
          CGO_ENABLED: '1'
          GOARCH: arm64
          CGO_LDFLAGS: -L${{ github.workspace }}/lib-ladybug -Wl,-rpath,@loader_path/lib-ladybug
          CGO_CFLAGS: -I${{ github.workspace }}/lib-ladybug/include
        run: |
          mkdir -p bin
          go build -tags=ladybug -o bin/kg-ladybug-darwin-arm64 ./cmd/kg

      # NOTE: amd64 CGO cross-compilation from arm64 macOS requires
      # that the Ladybug native libs ship a universal or x86_64 dylib.
      # If this fails, use a macos-13 (x86_64) runner instead.
      - name: Build amd64 (cross)
        env:
          CGO_ENABLED: '1'
          GOARCH: amd64
          CGO_LDFLAGS: -L${{ github.workspace }}/lib-ladybug -Wl,-rpath,@loader_path/lib-ladybug
          CGO_CFLAGS: -I${{ github.workspace }}/lib-ladybug/include
        run: |
          go build -tags=ladybug -o bin/kg-ladybug-darwin-amd64 ./cmd/kg

      - uses: actions/upload-artifact@v4
        with:
          name: kg-ladybug-darwin
          path: |
            bin/kg-ladybug-darwin-arm64
            bin/kg-ladybug-darwin-amd64

  ladybug-windows:
    name: Ladybug (Windows amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install MSYS2 + mingw toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain

      - name: Download Ladybug native libs
        shell: bash
        run: |
          curl -sL https://raw.githubusercontent.com/LadybugDB/go-ladybug/refs/heads/master/download_lbug.sh \
            -o download_lbug.sh
          chmod +x download_lbug.sh
          ./download_lbug.sh -out lib-ladybug -platform windows

      - name: Build
        shell: bash
        env:
          CC: x86_64-w64-mingw32-gcc
          CGO_ENABLED: '1'
        run: |
          export CGO_LDFLAGS="-L$(pwd)/lib-ladybug"
          export CGO_CFLAGS="-I$(pwd)/lib-ladybug/include"
          export PATH="$(pwd)/lib-ladybug:$PATH"
          mkdir -p bin
          go build -tags=ladybug -o bin/kg-ladybug-windows-amd64.exe ./cmd/kg

      - uses: actions/upload-artifact@v4
        with:
          name: kg-ladybug-windows-amd64
          path: bin/kg-ladybug-windows-amd64.exe

  # =============================================================
  # Attach ladybug binaries to the GoReleaser-created release
  # =============================================================
  attach-ladybug:
    name: Attach Ladybug to Release
    needs: [goreleaser, ladybug-linux, ladybug-macos, ladybug-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all ladybug artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kg-ladybug-*
          path: artifacts/
          merge-multiple: true

      - name: List artifacts
        run: ls -lR artifacts/

      - name: Generate checksums for ladybug binaries
        run: |
          cd artifacts
          sha256sum * > kg-ladybug-checksums.txt
          cat kg-ladybug-checksums.txt

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            artifacts/kg-ladybug-linux-amd64 \
            artifacts/kg-ladybug-darwin-arm64 \
            artifacts/kg-ladybug-darwin-amd64 \
            artifacts/kg-ladybug-windows-amd64.exe \
            artifacts/kg-ladybug-checksums.txt \
            --clobber