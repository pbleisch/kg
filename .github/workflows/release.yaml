name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux kg-ladybug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download LadybugDB libraries (Linux)
        run: |
          curl -sL https://raw.githubusercontent.com/LadybugDB/go-ladybug/refs/heads/master/download_lbug.sh | bash -s -- -out lib-ladybug || true
        continue-on-error: true

      - name: Set CGO environment (Linux)
        run: |
          echo "CGO_LDFLAGS=-L$(pwd)/lib-ladybug -Wl,-rpath,$(pwd)/lib-ladybug" >> $GITHUB_ENV
          echo "CGO_CFLAGS=-I$(pwd)/lib-ladybug/include" >> $GITHUB_ENV
          echo "CGO_ENABLED=1" >> $GITHUB_ENV

      - name: Build Linux kg-ladybug
        run: |
          mkdir -p bin
          GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -tags=ladybug -o bin/kg-ladybug-linux-amd64 ./cmd/kg

      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: kg-ladybug-linux-amd64
          path: bin/kg-ladybug-linux-amd64

  build-macos:
    name: Build macOS kg-ladybug
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Ladybug native libs (macOS)
        run: |
          set -e
          echo "Fetching Ladybug native libraries..."
          curl -sL https://raw.githubusercontent.com/LadybugDB/go-ladybug/refs/heads/master/download_lbug.sh -o download_lbug.sh
          chmod +x download_lbug.sh
          ./download_lbug.sh -out lib-ladybug -platform darwin || true
          ls -la lib-ladybug || true

      - name: Set CGO env (macOS)
        run: |
          echo "CGO_LDFLAGS=-L$(pwd)/lib-ladybug -Wl,-rpath,@loader_path/lib-ladybug" >> $GITHUB_ENV
          echo "CGO_CFLAGS=-I$(pwd)/lib-ladybug/include" >> $GITHUB_ENV
          echo "CGO_ENABLED=1" >> $GITHUB_ENV

      - name: Build macOS kg-ladybug (multi-arch)
        run: |
          set -e
          mkdir -p bin
          for arch in amd64 arm64; do
            echo "Building darwin/$arch"
            GOOS=darwin GOARCH=$arch CGO_ENABLED=1 go build -tags=ladybug -o bin/kg-ladybug-darwin-${arch} ./cmd/kg
          done

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kg-ladybug-darwin
          path: |
            bin/kg-ladybug-darwin-amd64
            bin/kg-ladybug-darwin-arm64

  build-windows:
    name: Build Windows kg-ladybug
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install MSYS2 + mingw toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: |
            mingw-w64-x86_64-toolchain

      - name: Install Ladybug native libs (Windows)
        shell: bash
        run: |
          set -e
          echo "Fetching Ladybug native libraries (using bash)..."
          curl -sL https://raw.githubusercontent.com/LadybugDB/go-ladybug/refs/heads/master/download_lbug.sh -o download_lbug.sh
          chmod +x download_lbug.sh
          ./download_lbug.sh -out lib-ladybug -platform windows || true
          ls -la lib-ladybug || true

      - name: Build Windows kg-ladybug (MSYS2 + build)
        shell: bash
        run: |
          set -e
          export CC=x86_64-w64-mingw32-gcc
          echo "Using CC=$CC"
          export CGO_LDFLAGS="-L$(pwd)/lib-ladybug"
          export CGO_CFLAGS="-I$(pwd)/lib-ladybug/include"
          export CGO_ENABLED=1
          export PATH="$(pwd)/lib-ladybug:$PATH"
          go build -tags=ladybug -o bin/kg-ladybug-windows-amd64.exe ./cmd/kg

      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: kg-ladybug-windows-amd64
          path: bin/kg-ladybug-windows-amd64.exe

  publish:
    name: Publish Release (goreleaser)
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifacts from build jobs
        uses: actions/download-artifact@v4
        with:
          name: kg-ladybug-linux-amd64
          path: artifacts/kg-linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: kg-ladybug-darwin
          path: artifacts/kg-macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: kg-ladybug-windows-amd64
          path: artifacts/kg-windows

      - name: Debug: list downloaded artifacts
        run: |
          echo "Contents of artifacts dir:" && ls -R artifacts || true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate gh CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Get release upload URL
        id: get_release
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          upload_url=$(gh release view "$TAG" --repo "$REPO" --json uploadUrl -q .uploadUrl)
          echo "upload_url=$upload_url" >> $GITHUB_OUTPUT

      - name: Upload Linux kg-ladybug
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: artifacts/kg-linux/bin/kg-ladybug-linux-amd64
          asset_name: kg-ladybug-linux-amd64
          asset_content_type: application/octet-stream

      - name: Upload macOS kg-ladybug (amd64)
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: artifacts/kg-macos/bin/kg-ladybug-darwin-amd64
          asset_name: kg-ladybug-darwin-amd64
          asset_content_type: application/octet-stream

      - name: Upload macOS kg-ladybug (arm64)
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: artifacts/kg-macos/bin/kg-ladybug-darwin-arm64
          asset_name: kg-ladybug-darwin-arm64
          asset_content_type: application/octet-stream

      - name: Upload Windows kg-ladybug
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: artifacts/kg-windows/bin/kg-ladybug-windows-amd64.exe
          asset_name: kg-ladybug-windows-amd64.exe
          asset_content_type: application/octet-stream
