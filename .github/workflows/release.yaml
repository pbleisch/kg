name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # kg is pure Go, so one GoReleaser job cross-compiles every platform and
  # creates the release. The three native-runner jobs that existed to build
  # against LadybugDB's C library, and the pin to LadybugDB v0.13.1 they
  # carried, went with the index (ADR-0027).
  goreleaser:
    name: Release (GoReleaser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
