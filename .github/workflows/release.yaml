name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Pin to the last ladybug release that has assets (v0.15.0 and v0.14.2 have
  # none). Update when a newer release ships assets.
  LBUG_VERSION: v0.13.1

jobs:
  # =============================================================
  # GoReleaser: non-CGO kg builds + creates the GitHub Release
  # =============================================================
  goreleaser:
    name: Release (GoReleaser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =============================================================
  # CGO Ladybug builds on native runners
  # Each job builds the binary, bundles the native lib alongside
  # it, and uploads a self-contained archive (.tar.gz or .zip).
  # The rpath embedded at build time ($ORIGIN/lib-ladybug on
  # Linux, @loader_path/lib-ladybug on macOS) means the binary
  # finds the lib automatically when the archive is extracted.
  # =============================================================
  ladybug-linux:
    name: Ladybug (Linux amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download Ladybug native libs
        run: |
          mkdir -p lib-ladybug
          TMPDIR=$(mktemp -d)
          curl -sL "https://github.com/LadybugDB/ladybug/releases/download/${{ env.LBUG_VERSION }}/liblbug-linux-x86_64.tar.gz" \
            | tar xzf - -C "$TMPDIR"
          find "$TMPDIR" -name "liblbug.so" -exec cp {} lib-ladybug/ \;
          rm -rf "$TMPDIR"

      - name: Build
        env:
          CGO_ENABLED: '1'
          CGO_LDFLAGS: -L${{ github.workspace }}/lib-ladybug -Wl,-rpath,$ORIGIN/lib-ladybug
        run: |
          mkdir -p bin
          go build -tags=ladybug -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o bin/kg-ladybug ./cmd/kg

      - name: Package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p staging/lib-ladybug
          cp bin/kg-ladybug staging/
          cp lib-ladybug/liblbug.so staging/lib-ladybug/
          tar czf "kg-ladybug_${VERSION}_linux_amd64.tar.gz" -C staging .

      - uses: actions/upload-artifact@v4
        with:
          name: kg-ladybug-linux-amd64
          path: kg-ladybug_${{ github.ref_name }}_linux_amd64.tar.gz

  ladybug-macos:
    name: Ladybug (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download Ladybug native libs
        run: |
          mkdir -p lib-ladybug
          TMPDIR=$(mktemp -d)
          curl -sL "https://github.com/LadybugDB/ladybug/releases/download/${{ env.LBUG_VERSION }}/liblbug-osx-universal.tar.gz" \
            | tar xzf - -C "$TMPDIR"
          find "$TMPDIR" -name "liblbug.dylib" -exec cp {} lib-ladybug/ \;
          rm -rf "$TMPDIR"

      - name: Build arm64 (native)
        env:
          CGO_ENABLED: '1'
          GOARCH: arm64
          CGO_LDFLAGS: -L${{ github.workspace }}/lib-ladybug -Wl,-rpath,@loader_path/lib-ladybug
        run: |
          mkdir -p bin
          go build -tags=ladybug -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o bin/kg-ladybug-darwin-arm64 ./cmd/kg

      # NOTE: amd64 CGO cross-compilation from arm64 macOS requires
      # that the Ladybug native libs ship a universal or x86_64 dylib.
      # If this fails, use a macos-13 (x86_64) runner instead.
      - name: Build amd64 (cross)
        env:
          CGO_ENABLED: '1'
          GOARCH: amd64
          CGO_LDFLAGS: -L${{ github.workspace }}/lib-ladybug -Wl,-rpath,@loader_path/lib-ladybug
        run: |
          go build -tags=ladybug -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o bin/kg-ladybug-darwin-amd64 ./cmd/kg

      - name: Package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for arch in arm64 amd64; do
            mkdir -p "staging-${arch}/lib-ladybug"
            cp "bin/kg-ladybug-darwin-${arch}" "staging-${arch}/kg-ladybug"
            cp lib-ladybug/liblbug.dylib "staging-${arch}/lib-ladybug/"
            tar czf "kg-ladybug_${VERSION}_darwin_${arch}.tar.gz" -C "staging-${arch}" .
          done

      - uses: actions/upload-artifact@v4
        with:
          name: kg-ladybug-darwin
          path: |
            kg-ladybug_${{ github.ref_name }}_darwin_arm64.tar.gz
            kg-ladybug_${{ github.ref_name }}_darwin_amd64.tar.gz

  ladybug-windows:
    name: Ladybug (Windows amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install MSYS2 + mingw toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain

      - name: Download Ladybug native libs
        shell: bash
        run: |
          mkdir -p lib-ladybug
          TMPDIR=$(mktemp -d)
          curl -sL "https://github.com/LadybugDB/ladybug/releases/download/${{ env.LBUG_VERSION }}/liblbug-windows-x86_64.zip" \
            -o "$TMPDIR/liblbug.zip"
          unzip -q "$TMPDIR/liblbug.zip" -d "$TMPDIR"
          find "$TMPDIR" -name "lbug_shared.dll" -exec cp {} lib-ladybug/ \;
          rm -rf "$TMPDIR"

      - name: Build
        shell: bash
        env:
          CC: x86_64-w64-mingw32-gcc
          CGO_ENABLED: '1'
        run: |
          export CGO_LDFLAGS="-L$(pwd)/lib-ladybug"
          export PATH="$(pwd)/lib-ladybug:$PATH"
          mkdir -p bin
          go build -tags=ladybug -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o bin/kg-ladybug.exe ./cmd/kg

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item bin\kg-ladybug.exe staging\
          # Windows finds DLLs in the same directory as the exe
          Copy-Item lib-ladybug\*.dll staging\
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path staging\* -DestinationPath "kg-ladybug_${version}_windows_amd64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: kg-ladybug-windows-amd64
          path: kg-ladybug_${{ github.ref_name }}_windows_amd64.zip

  # =============================================================
  # Attach ladybug archives to the GoReleaser-created release
  # =============================================================
  attach-ladybug:
    name: Attach Ladybug to Release
    needs: [goreleaser, ladybug-linux, ladybug-macos, ladybug-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all ladybug artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kg-ladybug-*
          path: artifacts/
          merge-multiple: true

      - name: List artifacts
        run: ls -lR artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > kg-ladybug-checksums.txt
          cat kg-ladybug-checksums.txt

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            artifacts/*.tar.gz \
            artifacts/*.zip \
            artifacts/kg-ladybug-checksums.txt \
            --clobber
